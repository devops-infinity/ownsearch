[workspace]
members = ["crates/ownsearch", "crates/ownsearch-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["Md. Sazzad Hossain Sharkar <sazzad@devops.bd>"]
repository = "https://github.com/devops-infinity/ownsearch"
homepage = "https://github.com/devops-infinity/ownsearch"
keywords = ["mcp", "searxng", "search", "metasearch"]
categories = ["command-line-utilities", "web-programming"]

[workspace.dependencies]
rmcp = { version = "3.7.0", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "request-state",
    "schemars",
] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "fs",
    "signal",
    "sync",
    "io-util",
    "net",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "gzip",
    "brotli",
    "system-proxy",
] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
secrecy = "0.10.3"
rpassword = "7.5.4"
zeroize = "1.9.1"
keyring = { version = "4.2.0", default-features = false, features = [
    "v1",
    "zbus-secret-service-keyring-store",
] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
anyhow = "1.0.104"
sha2 = "0.11.1"
hex = "0.4.3"
hmac = "0.13.0"
getrandom = "0.4.3"
url = "2.5.8"
toml = "1.1.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
x509-parser = "0.18.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
chromiumoxide = { package = "chromey", version = "2.58.2" }
futures-util = "0.3.34"
scraper = "0.29.0"
lopdf = "0.46.0"
ego-tree = "0.11.1"
insta = { version = "1.49.0", features = ["json"] }
wiremock = "0.6.5"
proptest = "1.12.0"
tower = "0.5.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 16
overflow-checks = true
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.checked]
inherits = "dev"
debug-assertions = true
overflow-checks = true

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
allow-dirty = ["ci"]
installers = ["shell", "powershell", "homebrew", "npm"]
npm-scope = "@devops-infinity"
unix-archive = ".tar.gz"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
