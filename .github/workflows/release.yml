name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/x86_64-linux-musl-gcc
          sudo ln -sf /usr/bin/musl-gcc /usr/local/bin/aarch64-linux-musl-gcc
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Install dist
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-dist@0.32.0
      - name: Build the target
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p target/distrib target/dist-manifests
          dist build --tag="$TAG" --artifacts=local --target="$TARGET" --no-local-paths --output-format=json > "target/dist-manifests/$TARGET.json"
          cp "target/dist-manifests/$TARGET.json" "target/distrib/$TARGET-dist-manifest.json"
      - name: Upload the target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/distrib/
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Install dist
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-dist@0.32.0
      - name: Download the target artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: target/distrib
          merge-multiple: true
      - name: Install the packaging tools
        run: sudo apt-get update && sudo apt-get install -y minisign zip
      - name: Build the installers
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          dist build --tag="$TAG" --artifacts=global --no-local-paths
          mkdir -p dist
          find target/distrib -maxdepth 1 -type f -exec cp -p {} dist/ \;
      - name: Build the MCPB bundle
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          TMP="$RUNNER_TEMP/mcpb"
          rm -rf "$TMP"
          mkdir -p "$TMP/server"
          cp mcpb/manifest.json "$TMP/manifest.json"
          tar -xzf "dist/ownsearch-x86_64-unknown-linux-gnu.tar.gz" -C "$TMP"
          install -m 0755 "$TMP/ownsearch-x86_64-unknown-linux-gnu/ownsearch" "$TMP/server/ownsearch"
          find "$TMP" -exec touch -t 198001010000 {} +
          (cd "$TMP" && zip -qXr "$GITHUB_WORKSPACE/dist/ownsearch-$VERSION.mcpb" manifest.json server)
          HASH="$(sha256sum "dist/ownsearch-$VERSION.mcpb" | awk '{print $1}')"
          printf '%s  ownsearch-%s.mcpb\n' "$HASH" "$VERSION" > "dist/ownsearch-$VERSION.mcpb.sha256"
      - name: Sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "::error::MINISIGN_KEY is not set; a release needs signed checksums"
            exit 1
          fi
          key="$(mktemp)"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MINISIGN_KEY" > "$key"
          (
            cd dist
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.mcpb' -o -name '*.rb' -o -name '*.sh' -o -name '*.ps1' \) \
              -printf '%f\n' | sort | xargs -r sha256sum > sha256.sum
          )
          test -s dist/sha256.sum
          minisign -S -s "$key" -m dist/sha256.sum
          if [ ! -s minisign.pub ]; then
            echo "::error::minisign.pub is missing; commit it once with: minisign -G -p minisign.pub -s ~/.minisign/minisign.key"
            exit 1
          fi
          cp minisign.pub dist/minisign.pub
          minisign -V -m dist/sha256.sum -p minisign.pub
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          source tools/lib.sh
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="$(workspace_version "$PWD")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "the tag $RELEASE_TAG does not match the workspace version v$version" >&2
            exit 1
          fi
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^## \[/ && index($0, heading) != 1 { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --draft --title "OwnSearch $RELEASE_TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
