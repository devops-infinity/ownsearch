name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt, llvm-tools-preview
      - name: Install gate tools
        run: |
          cargo install cargo-audit@0.22.2 --locked
          cargo install cargo-deny@0.20.2 --locked
          cargo install cargo-machete@0.9.2 --locked
          cargo install cargo-llvm-cov@0.9.1 --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps --locked
      - name: Doc tests
        run: cargo test --workspace --all-features --locked --doc
      - name: Advisories
        run: cargo audit --deny warnings
      - name: Dependency policy
        run: cargo deny check
      - name: Unused dependencies
        run: cargo machete
      - name: Coverage
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80

  build:
    name: build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Install dist
        run: cargo install cargo-dist@0.32.0 --locked
      - name: Build local artifacts
        run: dist build --artifacts=local --target=${{ matrix.target }}
      - name: Bill of materials
        run: cargo run --quiet -p ownsearch -- sbom --out dist/sbom-${{ matrix.target }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -z "${MINISIGN_KEY:-}" ]; then
            echo "MINISIGN_KEY is required for a release" >&2
            exit 1
          fi
          key="$(mktemp)"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MINISIGN_KEY" > "$key"
          (
            cd dist
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.json' \) \
              -printf '%f\n' | sort | xargs -r sha256sum > sha256.sum
          )
          test -s dist/sha256.sum
          minisign -S -s "$key" -m dist/sha256.sum
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "the tag $RELEASE_TAG does not match the workspace version v$version" >&2
            exit 1
          fi
          awk -v heading="## [$version]" '
            $0 ~ "^"heading { printing = 1 }
            printing && /^## \[/ && $0 !~ "^"heading { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" --draft --title "OwnSearch $RELEASE_TAG" --notes-file release-notes.md dist/*
      - name: Publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
